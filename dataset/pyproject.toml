[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-crawler"
version = "0.1.0"
description = "Chinese presenter video dataset collection and preprocessing"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "yt-dlp",
  "opencv-python>=4.8",
  "mediapipe>=0.10.14",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "faster-whisper>=1.1",
  "scenedetect>=0.6.4",
  "ultralytics>=8.3",
]

[tool.setuptools]
packages = ["src", "src.crawler", "src.cleaning", "src.features", "src.fragments", "src.splits"]

[tool.pytest.ini_options]
pythonpath = ["."]
