[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-neck-dataset"
version = "0.1.0"
description = "Video cleaning and dataset processing for Project-Neck"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "yt-dlp",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "mediapipe>=0.10.14",
  "matplotlib>=3.7",
  "funasr>=1.4.15",
  "qwen-asr>=0.0.6",
  "ultralytics>=8.3",
  "insightface==0.7.3",
  "onnxruntime-gpu[cuda,cudnn]>=1.21",
]

[tool.setuptools]
packages = ["src", "src.crawler", "src.processing"]

[tool.pytest.ini_options]
pythonpath = ["."]
