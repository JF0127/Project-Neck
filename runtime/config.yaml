audio:
  host: 0.0.0.0
  port: 8765
vad:
  backend: silero
  model_path: models/silero_vad/silero_vad.jit
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 500
asr:
  backend: qwen3_streaming
  model_path: ../dataset/models/qwen
  language: Chinese
  chunk_size_sec: 1.0
  unfixed_chunk_num: 4
  unfixed_token_num: 5
  gpu_memory_utilization: 0.7
  max_inference_batch_size: 1
  max_new_tokens: 4096
dialogue:
  backend: deepseek
  model: deepseek-flash
  base_url: https://api.deepseek.com
  timeout_sec: 30.0
  temperature: 0.7
tts:
  backend: doubao
motion:
  enabled: true
  backend: deepseek
  send_to_motor: true
  deepseek_model: deepseek-flash
  deepseek_timeout_sec: 15.0
  deepseek_temperature: 0.2
  deepseek_max_output_tokens: 1024
  model_path: models/baseline/model.pt  # used when backend=baseline
  vocab_path: models/baseline/vocab.json  # used when backend=baseline
  device: auto  # used when backend=baseline
  generated_dir: generated
  sync_offset_ms: 0
motor:
  feedback_enabled: true
  feedback_socket: /tmp/neck_feedback.sock
  feedback_stale_sec: 0.2
  send_enabled: true
  socket_path: /tmp/neck_model.sock
  measurement_socket: /tmp/neck_measurement.sock
  mock: false
xiaozhi:
  host: 0.0.0.0
  port: 8766
global_motion:
  fps: 30
  chunk_duration_sec: 1.0
  cycle_duration_sec: 8.0
  cycle_duration_variation: 0.06
  yaw_amplitude_deg: 4.5
  pitch_amplitude_deg: 2.5
  roll_amplitude_deg: 1.2
  yaw_phase_deg: 0
  pitch_phase_deg: 50
  roll_phase_deg: -70
  yaw_harmonic_ratio: 0.12
  pitch_harmonic_ratio: 0.10
  roll_harmonic_ratio: 0.10
  yaw_harmonic_phase_deg: 35
  pitch_harmonic_phase_deg: 120
  roll_harmonic_phase_deg: 20
  parameter_variation: 0.06
  state_transition_sec: 1.5
  states:
    silent: {amplitude: 0.85, speed: 0.90}
    listening: {amplitude: 0.95, speed: 0.95}
    thinking: {amplitude: 0.90, speed: 0.90}
    speaking: {amplitude: 1.0, speed: 1.0}
